spring.application.name=marcus
server.port=8081

#product.upload.dir=uploads/products
file.upload-dir=uploads/products/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#debug=true
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE_NAME:${user.home}/Desktop/logs/app.log}
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}



management.endpoint.health.show-details=always
management.endpoints.web.base-path=/eazybook/actuator
management.endpoints.web.exposure.include=*
management.endpoints.configprops.show-values=always
management.endpoints.env.show-values=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend Project for Eazy Book E-commerce application
info.app.version=1.0.0
